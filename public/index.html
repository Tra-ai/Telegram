<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#3390ec">
<title>Layzzchat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff;--surface:#fff;--field:#f1f3f5;--fg:#0f1419;--mut:#707579;--line:#e7e8ea;
  --pri:#3390ec;--pri-soft:rgba(51,144,236,.12);--on-pri:#fff;
  --in:#fff;--out:#d8ebff;--chat-bg:#e9eef3;--danger:#e53935;--ok:#2bb26a;
  --hover:rgba(0,0,0,.045);--shadow:0 1px 2px rgba(16,24,40,.12);--shadow-lg:0 12px 40px rgba(16,24,40,.25);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1621;--surface:#17212b;--field:#242f3d;--fg:#f4f6f8;--mut:#7f91a4;--line:#0b121a;
  --pri:#4ea4f6;--pri-soft:rgba(78,164,246,.16);--on-pri:#06121f;
  --in:#182533;--out:#2b5278;--chat-bg:#0e1621;--danger:#ff6b66;--ok:#4dd08a;
  --hover:rgba(255,255,255,.06);--shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 12px 40px rgba(0,0,0,.6);}}
:root[data-theme="dark"]{
  --bg:#0e1621;--surface:#17212b;--field:#242f3d;--fg:#f4f6f8;--mut:#7f91a4;--line:#0b121a;
  --pri:#4ea4f6;--pri-soft:rgba(78,164,246,.16);--on-pri:#06121f;
  --in:#182533;--out:#2b5278;--chat-bg:#0e1621;--danger:#ff6b66;--ok:#4dd08a;
  --hover:rgba(255,255,255,.06);--shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 12px 40px rgba(0,0,0,.6);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:16px/1.55 "Kantumruy Pro","Noto Sans Khmer",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--field);border-radius:12px;padding:11px 16px;transition:background .15s,transform .1s,opacity .15s}
button:active{transform:scale(.97)}
button:disabled{opacity:.55;cursor:default}
input,textarea{width:100%;padding:12px 14px;border:1.5px solid transparent;border-radius:12px;background:var(--field);outline:none;margin:5px 0;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--pri)}
::placeholder{color:var(--mut);opacity:.85}
button.primary{background:var(--pri);color:var(--on-pri);width:100%;margin-top:10px;font-weight:600;padding:13px}
button.danger,.danger{color:var(--danger)}
button.ghost{background:transparent}
.ic{display:inline-flex;flex:none;vertical-align:middle}
button.icon{background:transparent;padding:0;width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--mut);flex:none}
button.icon:hover{background:var(--hover)}
a{color:var(--pri)}
small,.muted{color:var(--mut)}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}

/* ---- shell: 1 pane on phones, 2 panes on wide screens ---- */
.shell{display:flex;height:100dvh;background:var(--bg)}
.side{width:100%;min-width:0;display:flex;flex-direction:column;background:var(--surface);position:relative}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--chat-bg);position:relative}
@media (min-width:860px){.side{width:360px;flex:none;border-right:1px solid var(--line)}.back{display:none!important}}
@media (max-width:859px){
  .shell[data-view="list"] .main{display:none}
  .shell:not([data-view="list"]) .side{display:none}
  .main>.screen{animation:slidein .22s ease-out}
}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.screen{height:100%;display:flex;flex-direction:column;min-height:0;position:relative}
.empty-main{margin:auto;text-align:center;color:var(--mut);padding:24px}
.empty-main .ic{width:84px;height:84px;border-radius:50%;background:var(--surface);align-items:center;justify-content:center;margin-bottom:12px;box-shadow:var(--shadow)}

/* ---- top bars ---- */
.bar{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;min-height:58px;background:var(--surface);box-shadow:0 1px 0 var(--line);position:relative;z-index:4;flex:none}
.bar .title{flex:1;font-size:19px;font-weight:700;min-width:0}
.peer{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer;padding:2px 4px;border-radius:12px}
.grow{flex:1;min-width:0}
.grow b,.grow small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow b{font-weight:600;line-height:1.35}
.status{font-size:13px}
.status.online,.status.typing{color:var(--pri)}
.typing-dots::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}


/* ---- bottom navigation (floating pill) ---- */
.sidebody{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.nav{position:absolute;left:12px;right:12px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;gap:2px;padding:5px;background:var(--surface);border-radius:34px;box-shadow:0 6px 28px rgba(16,24,40,.28),0 0 0 1px var(--line);z-index:6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav{box-shadow:0 6px 28px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06)}}
:root[data-theme="dark"] .nav{box-shadow:0 6px 28px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06)}
.tab{flex:1;background:transparent;border-radius:28px;padding:5px 2px 6px;line-height:1.45;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--fg);font-size:11.5px;font-weight:600;min-width:0}
.tab span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tab.on{background:var(--pri-soft);color:var(--pri)}
.tabic{position:relative;display:inline-flex;height:24px;align-items:center}
.tabic .av{box-shadow:0 0 0 2px transparent}
.tab.on .tabic .av{box-shadow:0 0 0 2px var(--pri)}
.tabic .badge{position:absolute;top:-5px;left:12px;font-size:11px;height:19px;line-height:19px;min-width:19px;padding:0 5px;border:2px solid var(--surface);box-sizing:content-box}
.sidebody .list{padding-bottom:110px}
.sidebody .pad{padding-bottom:120px}


/* ---- profile tab ---- */
.pfhead{text-align:center;padding:4px 0 2px}
.pfhead h2{margin:8px 0 0;font-size:22px;line-height:1.3}
.pfhead .status{display:block;margin-top:0;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.tile{background:var(--surface);border-radius:18px;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;box-shadow:var(--shadow);color:var(--fg)}
.tile .ic{color:var(--pri)}
.kv{padding:10px 14px;cursor:pointer;border-radius:12px}
.kv:hover{background:var(--hover)}
.kv div{font-size:17px;overflow-wrap:anywhere}
.kv small{display:block;margin-top:1px}


/* ---- settings menu ---- */
.sethead{text-align:center;padding:14px 0 6px}
.sethead h3{margin:10px 0 0;font-size:21px;line-height:1.3}
.mi{display:flex;align-items:center;gap:14px;padding:10px 12px;cursor:pointer;border-radius:14px;width:100%;background:transparent;text-align:left;color:inherit;text-decoration:none}
.mi:hover{background:var(--hover)}
.mi .sq{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.mi .grow b{font-weight:500;font-size:16px}
.mi .grow small{font-size:13.5px}
.mi .ic.chev{color:var(--mut);opacity:.6}
.subhead{display:flex;align-items:center;gap:6px;padding:4px 0 6px}
.subhead b{font-size:19px}
.tagbot{display:inline-block;background:var(--pri-soft);color:var(--pri);border-radius:6px;font-size:11px;font-weight:600;padding:1px 6px;margin-left:6px;vertical-align:middle}
.cmds{display:flex;gap:8px;overflow-x:auto;padding:6px max(10px,calc((100% - 780px)/2)) 0;flex:none}
.cmds button{flex:none;background:var(--pri-soft);color:var(--pri);border-radius:999px;padding:6px 12px;font-size:14px}
.startbtn{margin:8px max(10px,calc((100% - 780px)/2)) 0;background:var(--pri);color:#fff;border-radius:12px;padding:13px;font-weight:600;font-size:15px;letter-spacing:.5px;flex:none}
.tokenbox{word-break:break-all;user-select:all;background:var(--hover);border-radius:10px;padding:10px 12px;font-family:monospace;font-size:13px;margin:8px 0}
.code{white-space:pre-wrap;word-break:break-all;background:var(--hover);border-radius:10px;padding:10px 12px;font-family:monospace;font-size:12.5px;margin:6px 0}
.note{margin:4px 14px 10px;font-size:13.5px;color:var(--mut)}


/* ---- preferences ---- */
html[data-fs="s"] .txt{font-size:14.5px}
html[data-fs="l"] .txt{font-size:18.5px}
html[data-wall="sky"]{--chat-bg:linear-gradient(160deg,#cfe8ff,#8ec5fc)}
html[data-wall="mint"]{--chat-bg:linear-gradient(160deg,#d4fc79,#96e6a1)}
html[data-wall="rose"]{--chat-bg:linear-gradient(160deg,#ffd1dc,#f8a5c2)}
html[data-wall="sand"]{--chat-bg:linear-gradient(160deg,#f6e7c8,#e0c28f)}
html[data-wall="night"]{--chat-bg:linear-gradient(160deg,#1b2a49,#0b1220)}
html.lowpower *{animation:none!important;transition:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.swatches{display:flex;gap:12px;padding:8px 12px 14px;flex-wrap:wrap}
.swatch{width:46px;height:46px;border-radius:50%;padding:0;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatch.on{box-shadow:0 0 0 3px var(--pri)}
.folders{display:flex;gap:8px;padding:0 14px 8px;overflow-x:auto;flex:none;scrollbar-width:none}
.folders::-webkit-scrollbar{display:none}
.fchip{background:var(--field);color:var(--mut);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.fchip.on{background:var(--pri-soft);color:var(--pri)}
.imgph{display:flex;align-items:center;gap:8px;line-height:1.4;background:var(--field);color:var(--fg);padding:26px 22px;border-radius:12px;width:100%;justify-content:center;font-size:14px}

/* ---- avatar ---- */
.avw{position:relative;flex:none;line-height:0}
.av{border-radius:50%;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;line-height:1}
.dot{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:var(--ok);border:2.5px solid var(--surface)}
.row.active .dot{border-color:var(--pri)}

/* ---- chat list ---- */
.searchrow{padding:2px 14px 12px;position:relative;flex:none;background:var(--surface)}
.searchrow input{margin:0;padding:12px 18px 12px 50px;border-radius:26px;font-size:17px;background:var(--field);border:0}
.searchrow input::-webkit-search-cancel-button{display:none}
.searchrow .ic{position:absolute;left:30px;top:calc(50% - 5px);transform:translateY(-50%);color:var(--mut);pointer-events:none}
.bar.flat{box-shadow:none}
.list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:90px}
.row{display:flex;align-items:center;gap:12px;padding:9px 12px;cursor:pointer;margin:0 6px;border-radius:14px;transition:background .12s}
.row:hover{background:var(--hover)}
.row:active{background:var(--pri-soft)}
.row.active,.row.active:hover{background:var(--pri);color:var(--on-pri)}
.row.active small,.row.active .right,.row.active .grow small{color:rgba(255,255,255,.82)}
.row.active .badge{background:#fff;color:var(--pri)}
.row .line1{display:flex;align-items:center;gap:6px}
.row .line1 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .line2{display:flex;align-items:center;gap:6px}
.row .line2 small{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.when{font-size:12px;color:var(--mut);flex:none;display:inline-flex;align-items:center;gap:2px}
.row.active .when{color:rgba(255,255,255,.82)}
.tick{color:var(--pri)}
.row.active .tick{color:#fff}
.badge{background:var(--pri);color:var(--on-pri);border-radius:999px;font-size:12px;font-weight:600;padding:0 7px;min-width:22px;height:22px;line-height:22px;text-align:center;flex:none}
.tag{font-size:12px;border-radius:6px;padding:0 7px;color:var(--pri);background:var(--pri-soft);flex:none}
.fab{position:absolute;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--pri);color:var(--on-pri);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:var(--shadow-lg);z-index:5}
.sk{border-radius:10px;background:linear-gradient(90deg,var(--field) 25%,var(--hover) 37%,var(--field) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
.row-sk{display:flex;gap:12px;padding:10px 18px;align-items:center}

/* ---- messages ---- */
.msgwrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.msgs{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px max(10px,calc((100% - 780px)/2));display:flex;flex-direction:column}
.msg{display:flex;align-items:flex-end;gap:6px;margin-top:2px;scroll-margin:70px}
.msg.first{margin-top:9px}
.msg.mine{justify-content:flex-end}
.msg .avs{width:32px;flex:none;line-height:0}
.bub{position:relative;max-width:min(80%,540px);background:var(--in);border-radius:17px;padding:6px 11px 6px;box-shadow:var(--shadow);overflow-wrap:anywhere;word-break:break-word;transition:transform .15s}
.bub::after{content:"";display:block;clear:both}
.msg:not(.mine) .bub{border-bottom-left-radius:5px}
.msg:not(.mine):not(.first) .bub{border-top-left-radius:5px}
.msg.mine .bub{background:var(--out);border-bottom-right-radius:5px}
.msg.mine:not(.first) .bub{border-top-right-radius:5px}
.msg:not(.last):not(.mine) .bub{border-bottom-left-radius:5px}
.bub.failed{outline:1.5px solid var(--danger)}
.bub.pending{opacity:.75}
.flash .bub{animation:flash 1.1s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--pri)}100%{box-shadow:var(--shadow)}}
.who{font-size:13px;font-weight:600;margin-bottom:1px}
.txt{white-space:pre-wrap;line-height:1.5}
.meta{float:right;margin:8px 0 -3px 12px;font-size:11.5px;color:var(--mut);display:inline-flex;align-items:center;gap:3px;line-height:1.2;user-select:none}
.meta .tick{display:inline-flex}
.meta .err{color:var(--danger)}
.blockmeta{display:flex;justify-content:flex-end;margin-top:2px}
.blockmeta .meta{float:none;margin:0}
.media{position:relative;line-height:0;margin:-2px -5px 2px;border-radius:12px;overflow:hidden;cursor:zoom-in}
.media img,.media video{display:block;max-width:100%;max-height:360px;width:auto;height:auto;min-width:140px;background:var(--field)}
.media video{cursor:auto}
.media .meta{position:absolute;right:7px;bottom:6px;margin:0;float:none;background:rgba(0,0,0,.5);color:#fff;border-radius:11px;padding:1px 8px}
.media .meta .tick{color:#fff}
.quote{border-left:3px solid var(--pri);background:var(--pri-soft);padding:3px 9px;margin:2px 0 5px;font-size:13.5px;border-radius:4px 8px 8px 4px;cursor:pointer;line-height:1.4;overflow:hidden}
.quote b{display:block;color:var(--pri);font-weight:600}
.quote div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
.file{display:flex;align-items:center;gap:10px;padding:2px 0;text-decoration:none;color:inherit;min-width:190px}
.file .fi{width:42px;height:42px;border-radius:50%;background:var(--pri);color:var(--on-pri);display:flex;align-items:center;justify-content:center;flex:none}
.file small{display:block}
.voice{display:flex;align-items:center;gap:10px;min-width:210px;padding:2px 0}
.voice .pp{width:40px;height:40px;border-radius:50%;background:var(--pri);color:var(--on-pri);padding:0;display:flex;align-items:center;justify-content:center;flex:none}
.wave{display:flex;align-items:center;gap:2px;height:30px;flex:1}
.wave i{display:block;width:3px;border-radius:2px;background:var(--mut);opacity:.45;transition:opacity .1s,background .1s}
.wave i.on{background:var(--pri);opacity:1}
.voice small{font-size:12px;min-width:34px}
.daygrp{display:flex;flex-direction:column}
.day{position:sticky;top:6px;z-index:2;align-self:center;font-size:12.5px;font-weight:500;color:#fff;background:rgba(40,50,60,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:2px 12px;margin:10px 0 4px}
.older{align-self:center;font-size:13.5px;background:var(--surface);box-shadow:var(--shadow);margin:6px 0;padding:7px 16px;border-radius:999px;color:var(--pri)}
.hello{margin:auto;text-align:center;background:var(--surface);color:var(--mut);border-radius:18px;padding:18px 26px;box-shadow:var(--shadow)}
.hello .big{font-size:42px;line-height:1.2}
.jump{position:absolute;right:14px;bottom:12px;width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--mut);box-shadow:var(--shadow-lg);padding:0;display:flex;align-items:center;justify-content:center;z-index:5}
.jump .badge{position:absolute;top:-8px;right:-4px;height:20px;line-height:20px;min-width:20px}

/* ---- composer ---- */
.ctx{display:flex;align-items:center;gap:10px;padding:7px 12px 7px 16px;background:var(--surface);border-top:1px solid var(--line);flex:none}
.ctx .ic.lead{color:var(--pri)}
.ctx .grow b{color:var(--pri);font-size:13.5px}
.ctx .grow small{font-size:13.5px}
.composer{display:flex;align-items:flex-end;gap:8px;padding:8px max(10px,calc((100% - 780px)/2)) calc(8px + env(safe-area-inset-bottom));flex:none}
.cwrap{flex:1;display:flex;align-items:flex-end;background:var(--surface);border-radius:23px;box-shadow:var(--shadow);min-width:0;padding:2px 2px}
.cwrap textarea{border:0;background:transparent;margin:0;padding:10px 4px;max-height:130px;resize:none;border-radius:0;line-height:1.45;min-height:44px}
.cwrap button.icon{height:44px;width:44px}
.act{width:46px;height:46px;border-radius:50%;background:var(--pri);color:var(--on-pri);padding:0;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--shadow)}
.act.rec{background:var(--danger);color:#fff}
.recbar{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:23px;box-shadow:var(--shadow);padding:0 6px 0 16px;min-height:48px}
.recdot{width:11px;height:11px;border-radius:50%;background:var(--danger);animation:pulse 1s ease infinite}
@keyframes pulse{50%{opacity:.25}}
.blockbar{display:flex;align-items:center;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--surface);font-size:14px;flex:none}
.blockbar button{background:var(--pri-soft);color:var(--pri);font-weight:600}

/* ---- overlays ---- */
.overlay{position:fixed;inset:0;background:rgba(10,15,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}}
.panel{background:var(--surface);width:100%;max-width:520px;max-height:88dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (min-width:600px){.overlay{align-items:center}.panel{border-radius:20px;max-width:440px;box-shadow:var(--shadow-lg)}}
.overlay.dlg{align-items:center}
.overlay.dlg .panel{border-radius:20px;max-width:360px;margin:0 20px;padding:20px}
.dlg p{margin:6px 0 14px;color:var(--mut)}
.dlg .btns{display:flex;gap:8px;justify-content:flex-end}
.dlg .btns button{flex:0 1 auto;padding:10px 18px;background:transparent;font-weight:600;color:var(--pri)}
.dlg .btns button.danger{color:var(--danger)}
.panel-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.panel-h b{font-size:18px}
.sheet-i{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin:2px 0;background:transparent;padding:12px 10px}
.sheet-i:hover{background:var(--hover)}
.sheet-i .ic{color:var(--mut)}
.sheet-i.danger .ic{color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:var(--pri-soft);color:var(--pri);border-radius:999px;padding:3px 6px 3px 12px;font-size:14px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.center{text-align:center}.center .av{margin:0 auto}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:40;display:flex;align-items:center;justify-content:center;animation:fade .15s;cursor:zoom-out}
.lb img{max-width:96vw;max-height:92dvh;object-fit:contain}
.lb button{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;color:#fff}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(25,30,36,.94);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;max-width:90%;font-size:14px;box-shadow:var(--shadow-lg);animation:fade .2s}

/* ---- auth ---- */
.authwrap{height:100dvh;overflow-y:auto;display:flex;background:linear-gradient(160deg,var(--pri-soft),transparent 55%),var(--bg)}
.auth{margin:auto;width:100%;max-width:400px;padding:max(28px,env(safe-area-inset-top)) 22px 28px}
.logo{width:84px;height:84px;border-radius:26px;background:linear-gradient(145deg,#59b3ff,var(--pri));color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 10px 30px rgba(51,144,236,.4)}
.auth h1{text-align:center;margin:0 0 4px;font-size:26px}
.auth .sub{text-align:center;margin:0 0 22px;color:var(--mut)}
.seg{display:flex;background:var(--field);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;background:transparent;padding:9px 6px;border-radius:9px;color:var(--mut);font-weight:500}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow);font-weight:600}
.pw{position:relative}.pw input{padding-right:46px}
.pw button{position:absolute;right:2px;top:5px;height:46px;width:44px;background:transparent;color:var(--mut);padding:0;display:flex;align-items:center;justify-content:center}
.err{color:var(--danger);min-height:1.5em;font-size:14px;margin:4px 2px 0}

/* login: clean, roomy, pill-shaped */
.authwrap{position:relative;background:radial-gradient(120% 60% at 50% 0%,var(--pri-soft),transparent 70%),var(--bg)}
.authwrap::before,.authwrap::after{content:"";position:fixed;border-radius:50%;border:1.5px solid var(--pri-soft);pointer-events:none}
.authwrap::before{width:520px;height:520px;left:50%;top:-250px;transform:translateX(-50%)}
.authwrap::after{width:760px;height:760px;left:50%;top:-370px;transform:translateX(-50%)}
.auth{position:relative;max-width:420px;padding:max(36px,env(safe-area-inset-top)) 24px 32px}
.auth h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.auth .sub{margin-bottom:28px;font-size:15px}
.auth .seg{border-radius:999px;padding:5px;margin-bottom:22px;background:var(--field)}
.auth .seg button{border-radius:999px;padding:12px 6px;font-size:16px}
.auth .fl{display:block;font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--mut);margin:14px 4px 7px}
.auth input{height:54px;border-radius:999px;padding:0 22px;font-size:16px;background:var(--field);border:1.5px solid transparent;transition:border-color .15s,background .15s}
.auth input:focus{border-color:var(--pri);background:var(--surface);outline:none}
.auth .pw input{padding-right:54px}
.auth .pw button{right:6px;top:4px}
.auth .primary{height:56px;border-radius:999px;font-size:17px;font-weight:700;margin-top:18px;width:100%;box-shadow:0 8px 22px var(--pri-soft)}
.auth .err{text-align:center;margin-top:10px}

.auth .or{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:13px;margin:22px 0 14px}
.auth .or::before,.auth .or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth .ghost{width:100%;height:54px;border-radius:999px;background:var(--field);color:var(--fg);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.auth .link{background:transparent;color:var(--pri);font-weight:600;padding:8px 6px}
.auth .link:disabled{color:var(--mut)}
.auth .row2{display:flex;justify-content:space-between;margin-top:10px}
.auth .center{text-align:center}

/* ---- profile / forms ---- */
.pad{padding:14px;overflow-y:auto;flex:1;width:100%;max-width:640px;margin:0 auto}
.card{background:var(--surface);border-radius:16px;padding:6px;margin:12px 0;box-shadow:var(--shadow)}
.card.p{padding:14px}
.card h4{margin:6px 10px 2px;font-size:13px;color:var(--mut);font-weight:600}
.card .row{margin:0}
.avedit{position:relative;display:inline-block;cursor:pointer;line-height:0}
.avedit .cam{position:absolute;right:-2px;bottom:-2px;width:32px;height:32px;border-radius:50%;background:var(--pri);color:var(--on-pri);display:flex;align-items:center;justify-content:center;border:3px solid var(--bg)}
.sw{appearance:none;-webkit-appearance:none;width:46px!important;height:28px;border-radius:14px;background:var(--line)!important;position:relative;margin:0!important;padding:0!important;border:0!important;flex:none;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw:checked{background:var(--pri)!important}
.sw:checked::after{transform:translateX(18px)}

/* ---- privacy mode ---- */
.wm{position:absolute;inset:0;pointer-events:none;z-index:3}
.secure .msgs,.secure .bar{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.secure img,.secure video{-webkit-user-drag:none}
.shield{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;align-items:center;justify-content:center;color:var(--mut)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

      menuItem(C('#ff7a85', '#e5384a'), 'bell', 'ការជូនដំណឹង', 'សំឡេង, ញ័រ', () => goSettings('notif')),
      menuItem(C('#6d8dff', '#3b5bdb'), 'pie', 'ទិន្នន័យ និងទំហំផ្ទុក', 'ការផ្ទុករូបភាព', () => goSettings('data')),
      menuItem(C('#4aa8ff', '#1c7ed6'), 'folder', 'តម្រង chat', 'ទាំងអស់, ឯកជន, ក្រុម, មិនទាន់អាន', () => goSettings('folders')),
      menuItem(C('#38d3c0', '#0b9c8c'), 'bot', 'Bots', 'បង្កើត និងគ្រប់គ្រង Bot របស់អ្នក', () => goSettings('bots')),
      menuItem(C('#4dd0e1', '#0097a7'), 'devices', 'ឧបករណ៍', 'គ្រប់គ្រងឧបករណ៍ដែលបានចូល', () => goSettings('devices')),
      menuItem(C('#ffa94d', '#e8590c'), 'battery', 'សន្សំថ្ម', 'កាត់បន្ថយការប្រើថ្មពេលថ្មទាប', () => goSettings('power')),
      menuItem(C('#b983f5', '#7c3fe0'), 'globe', 'ភាសា', 'ខ្មែរ', () => goSettings('lang')),
      me.role === 'ADMIN' ? menuItem(C('#8d6cf0', '#5f3dc4'), 'shield', 'Admin Dashboard', 'គ្រប់គ្រងអ្នកប្រើ', '/admin/', 'a') : null),
    h('div', { class: 'card' }, h('button', { class: 'sheet-i danger', onclick: logout }, ic('logout'), 'ចាកចេញ')),
    h('div', { style: 'height:12px' }));
}

/* ---------- Bots: create & manage (like BotFather, inside the app) ---------- */
const isBotName = (u) => /bot$/i.test(u || '');
const apiBase = () => location.origin + '/api/bot/';
function botsPage() {
  const list = h('div', {});
  const load = safe(async () => {
    const d = await api('/bots');
    list.replaceChildren(...(d.bots.length ? d.bots.map((b) => h('div', { class: 'row', style: 'margin:0', onclick: () => botDetail(b, load) },
      avatar(b.avatarUrl, b.displayName, 42), h('div', { class: 'grow' }, h('b', {}, b.displayName, h('span', { class: 'tagbot' }, 'BOT')), h('small', {}, '@' + b.username)), ic('chev', 18)))
      : [h('p', { class: 'muted', style: 'margin:8px 12px' }, 'អ្នកមិនទាន់មាន Bot ទេ')]));
  });
  load();
  return subPage('Bots',
    h('div', { class: 'card' }, h('button', { class: 'sheet-i', onclick: () => createBot(load) }, ic('plus'), 'បង្កើត Bot ថ្មី'), list),
    note('Bot គឺជាគណនីពិសេសដែលកម្មវិធី (code) របស់អ្នកគ្រប់គ្រង តាមរយៈ Bot API។ Username ត្រូវបញ្ចប់ដោយ "bot"។ អាចមានបាន 10 Bot។'));
}
function showToken(b, token) {
  const close = modal('Token របស់ Bot', h('div', {},
    h('p', { class: 'muted' }, 'ចម្លង token នេះទុក — វាបង្ហាញតែម្ដងគត់។ ហាមចែកអោយអ្នកដទៃ។'),
    h('div', { class: 'tokenbox' }, token),
    h('button', { class: 'primary', onclick: async () => { try { await navigator.clipboard.writeText(token); toast('បានចម្លង'); } catch { toast('សូមចុចសង្កត់លើ token ដើម្បីចម្លង'); } } }, 'ចម្លង Token'),
    h('div', { style: 'height:8px' }),
    h('button', { onclick: () => { close(); botDetail(b); } }, 'រួចរាល់')));
}
function createBot(reload) {
  const name = h('input', { placeholder: 'ឈ្មោះ Bot (ឧ. ហាងខ្ញុំ)', maxlength: 50 });
  const user = h('input', { placeholder: 'username ឧ. my_shop_bot', maxlength: 32, autocapitalize: 'none', autocomplete: 'off' });
  const desc = h('input', { placeholder: 'ពិពណ៌នា (មិនបង្ខំ)', maxlength: 200 });
  const close = modal('បង្កើត Bot ថ្មី', h('div', {}, name, user, desc, h('button', { class: 'primary', onclick: safe(async () => {
    const d = await api('/bots', { method: 'POST', body: { name: name.value, username: user.value, description: desc.value } });
    close(); reload && reload(); showToken(d.bot, d.token);
  }) }, 'បង្កើត')));
  setTimeout(() => name.focus(), 80);
}
function botDetail(b, reload) {
  const close = modal(b.displayName, h('div', {},
    h('p', { class: 'muted', style: 'margin:0 0 8px' }, '@' + b.username + (b.description ? ' · ' + b.description : '')),
    h('div', { class: 'card', style: 'margin:0' },
      h('button', { class: 'sheet-i', onclick: safe(async () => { close(); const u = { id: b.id, displayName: b.displayName, username: b.username, avatarUrl: b.avatarUrl }; await openPrivate([u]); }) }, ic('message'), 'បើក chat ជាមួយ Bot'),
      h('button', { class: 'sheet-i', onclick: safe(async () => {
        if (!await confirmDialog({ title: 'បង្កើត token ថ្មី?', text: 'token ចាស់នឹងឈប់ដំណើរការភ្លាមៗ។' })) return;
        const d = await api(`/bots/${b.id}/token`, { method: 'POST', body: {} }); close(); showToken(b, d.token);
      }) }, ic('key'), 'បង្កើត Token ថ្មី'),
      h('button', { class: 'sheet-i', onclick: safe(async () => {
        const v = await promptDialog({ title: 'ឈ្មោះ Bot', value: b.displayName }); if (!v || !v.trim()) return;
        const d = await api(`/bots/${b.id}`, { method: 'PATCH', body: { name: v } }); close(); reload && reload(); botDetail(d.bot, reload);
      }) }, ic('pencil'), 'ប្ដូរឈ្មោះ'),
      h('button', { class: 'sheet-i', onclick: safe(async () => {
        const v = await promptDialog({ title: 'ពិពណ៌នា Bot', value: b.description || '' }); if (v == null) return;
        const d = await api(`/bots/${b.id}`, { method: 'PATCH', body: { description: v } }); close(); reload && reload(); botDetail(d.bot, reload);
      }) }, ic('message'), 'ប្ដូរពិពណ៌នា'),
      h('button', { class: 'sheet-i', onclick: () => { close(); botDocs(b); } }, ic('bot'), 'របៀបប្រើ API'),
      h('button', { class: 'sheet-i danger', onclick: safe(async () => {
        if (!await confirmDialog({ title: 'លុប Bot?', text: 'chat និងសារទាំងអស់របស់ Bot នឹងបាត់។', ok: 'លុប', danger: true })) return;
        await api(`/bots/${b.id}`, { method: 'DELETE' }); close(); reload && reload(); toast('បានលុប');
      }) }, ic('trash'), 'លុប Bot'))));
}
function botDocs(b) {
  const base = apiBase() + '<TOKEN>';
  const code = `# ទទួលសារថ្មី\ncurl "${base}/getUpdates?timeout=5"\n\n# ឆ្លើយតប\ncurl -X POST "${base}/sendMessage" \\\n  -H "Content-Type: application/json" \\\n  -d '{"chat_id":"<chat.id>","text":"សួស្ដី!"}'\n\n# Python\nimport requests, time\nAPI = "${base}"\noffset = None\nwhile True:\n    r = requests.get(API + "/getUpdates", params={"offset": offset, "timeout": 5}).json()\n    for u in r["result"]:\n        offset = u["update_id"] + 1\n        m = u["message"]\n        if m.get("text"):\n            requests.post(API + "/sendMessage", json={"chat_id": m["chat"]["id"], "text": "អ្នកនិយាយថា: " + m["text"]})`;
  modal('Bot API · @' + b.username, h('div', {},
    h('p', { class: 'muted', style: 'margin:0' }, 'Methods: getMe, getUpdates, sendMessage, editMessageText, deleteMessage, sendChatAction, setMyCommands, getMyCommands។ ជំនួស <TOKEN> ដោយ token របស់ Bot។'),
    h('div', { class: 'code' }, code)));
}
// In a bot's chat: command chips (from setMyCommands) + a START button on an empty chat
let botInfoFor = null;
async function loadBotInfo() {
  if (!ui || !cur || cur.type !== 'PRIVATE' || !cur.peer || !isBotName(cur.peer.username) || cur.peer.id === me.id) { if (ui) { ui.cmds.hidden = true; ui.start.hidden = true; } return; }
  const id = cur.id;
  let info = { commands: [] };
  try { info = await api('/bots/info/' + cur.peer.id); } catch { /* fine */ }
  if (!cur || cur.id !== id) return;
  botInfoFor = id;
  const send = (t) => { ui.input.value = t; sendText(); };
  ui.cmds.replaceChildren(...(info.commands || []).map((c) => h('button', { title: c.description, onclick: () => send('/' + c.command) }, '/' + c.command)));
  ui.cmds.hidden = !(info.commands || []).length;
  ui.start.onclick = () => { ui.start.hidden = true; send('/start'); };
  updateStart();
}
function updateStart() { if (ui && ui.start && botInfoFor === (cur && cur.id)) ui.start.hidden = !!msgs.size || !!cur.blockedByMe; }
function changePassword() {
  const cp = h('input', { type: 'password', placeholder: 'ពាក្យសម្ងាត់បច្ចុប្បន្ន', autocomplete: 'current-password' });
  const np = h('input', { type: 'password', placeholder: 'ពាក្យសម្ងាត់ថ្មី (8+ តួ)', autocomplete: 'new-password' });
  const close = modal('ប្ដូរពាក្យសម្ងាត់', h('div', {}, cp, np, h('button', { class: 'primary', onclick: safe(async () => {
    saveAuth(await api('/auth/password', { method: 'POST', body: { currentPassword: cp.value, newPassword: np.value } }));
    close(); toast('បានប្ដូរ · ឧបករណ៍ផ្សេងត្រូវចូលម្ដងទៀត');
  }) }, 'រក្សាទុក')));
}


/* Public / Private mode. Private = watermark, no copy, blur on app switch, and inside the Android app
   screenshots + screen recording come out black (FLAG_SECURE, toggled through the LayzzAndroid bridge). */
function applyPrivacy() { try { if (window.LayzzAndroid) window.LayzzAndroid.setSecure(!!secure); } catch { /* not in the app */ } }
function privacyCard() {
  const seg = h('div', { class: 'seg', style: 'margin:6px 10px 6px' });
  const note = h('p', { class: 'note', style: 'margin:2px 14px 12px' });
  const native = !!window.LayzzAndroid;
  const set = (v) => { secure = v; store.set('secure', v ? '1' : '0'); applyPrivacy(); draw(); };
  function draw() {
    seg.replaceChildren(h('button', { class: secure ? '' : 'on', onclick: () => set(false) }, 'សាធារណៈ'), h('button', { class: secure ? 'on' : '', onclick: () => set(true) }, 'ឯកជន'));
    note.textContent = secure
      ? (native ? 'Screenshot និងការថតអេក្រង់ នឹងចេញខ្មៅ · មាន watermark ឈ្មោះអ្នក · បិទការចម្លងសារ · បាំងអេក្រង់ពេលចេញពី app'
        : 'មាន watermark ឈ្មោះអ្នក · បិទការចម្លងសារ · បាំងអេក្រង់ពេលចេញ។ លើ browser មិនអាចធ្វើឱ្យ screenshot ខ្មៅបានទេ ត្រូវប្រើ app APK')
      : 'គ្មានការការពារ។ អាចថត screenshot និងថតអេក្រង់បាន ហើយអាចចម្លងសារបាន។';
  }
  draw();
  return h('div', { class: 'card' }, h('h4', {}, 'ទម្រង់ chat'), seg, note);
}

/* ---------- privacy shield ---------- */
const shield = h('div', { class: 'shield', hidden: true, onclick: () => { shield.hidden = true; } }, ic('lock', 64));
document.body.append(shield);
const shieldOn = () => { if (secure && view === 'chat') shield.hidden = false; };
document.addEventListener('visibilitychange', () => { if (document.hidden) shieldOn(); else shield.hidden = true; });
window.addEventListener('blur', shieldOn);
window.addEventListener('pagehide', shieldOn);
window.addEventListener('focus', () => { shield.hidden = true; });
document.addEventListener('contextmenu', (e) => { if (secure && view === 'chat' && !e.target.closest('textarea,input')) e.preventDefault(); });

/* ---------- navigation + boot ---------- */
window.addEventListener('popstate', () => {
  if (overlays.length) closeAllOverlays();
  if (me && view !== 'list') showList();
});
applyPrivacy();
(async function boot() {
  if (!token) return mount(authView());
  try { me = (await api('/auth/me')).user; showList(); }
  catch (e) { if (token) mount(h('div', { class: 'authwrap' }, h('div', { class: 'auth center' }, h('p', {}, 'មិនអាចភ្ជាប់ server: ' + e.message), h('button', { class: 'primary', onclick: () => location.reload() }, 'ព្យាយាមម្ដងទៀត')))); else mount(authView()); }
})();
</script>
